# The template's checks, and a project's: what a reviewer would otherwise run by hand. A reusable
# workflow, which the project's own ci.yml calls, so a project adds jobs of its own (a release, a
# deploy) in ci.yml while this file, and its fixes, come with `make template-update`.
name: t10-template

on:
  workflow_call:

jobs:
  # Lint, the template's own tests and the Go kit's: no stack needed.
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint
      - run: make test-template

  # The whole stack from empty volumes with the scripted model: each module's tests, then up,
  # seed-demo, check and smoke. The template has no module, so it scaffolds one to check.
  verify:
    needs: template
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: A module to check, in the template
        run: ls -d modules/*/ >/dev/null 2>&1 || make new-module ID=ci
      - run: make doctor
      - run: make verify SCRIPTED=1
      - name: Logs, when it failed
        if: failure()
        run: platform/scripts/compose.sh ps -a && platform/scripts/compose.sh logs --tail=200
