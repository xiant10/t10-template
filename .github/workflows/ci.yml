# The template's checks, and a project's: what a reviewer would otherwise run by hand.
# It comes from the template, so a project gets it, and its fixes, with `make template-update`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint, the template's own tests and the Go kit's: no stack needed.
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint
      - run: make test-template

  # The whole stack from empty volumes with the scripted model: each module's tests, then up,
  # seed-demo, check and smoke. The template has no module, so it scaffolds one to check.
  verify:
    needs: template
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: A module to check, in the template
        run: ls -d modules/*/ >/dev/null 2>&1 || make new-module ID=ci
      - run: make doctor
      - run: make verify SCRIPTED=1
      - name: Logs, when it failed
        if: failure()
        run: scripts/compose.sh ps -a && scripts/compose.sh logs --tail=200
