# This project's CI: the project's own file, which template updates leave alone. The checks
# themselves are the template's, in t10-template.yml; add the project's own jobs below them,
# such as a release or a deploy, with `needs: checks`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    uses: ./.github/workflows/t10-template.yml
