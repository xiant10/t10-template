# The whole foundation on Kubernetes: what every cluster shares. A skeleton until `make vendor`
# fills ../vendor/ (docs/plan.md, phase E). It will list, from ../vendor/<repo>/:
#   auth-server, ai-gateway, agent-pi, agent-ti, agent-sales, t10-livekit-agent, workbench,
#   t10-collab, t10-knowledge, t10-agent-control, t10-console, t10-automations,
#   and t10-agents' component,
# with an `images:` block mapping each to its pin in the merged versions.env. The namespace is set by
# generated/<env>/kustomization.yaml, as <PROJECT_NAME>-<env>.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
