# A scripted model instead of a provider, so the stack runs and `make smoke` passes with
# no LLM_API_KEY. scripts/compose.sh adds this file when SCRIPTED=1. Paths are from the deployment bundle.
services:
  fake-model:
    image: node:24.21.0-bookworm-slim
    command: ["node", "/fake-model.mjs"]
    volumes:
      - ./platform/foundation/scripted/fake-model.mjs:/fake-model.mjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/seen').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

  ai-gateway-llm:
    environment:
      OPENAI_BASE_URL: http://fake-model:8080
      OPENAI_API_KEY: scripted
    depends_on:
      fake-model: {condition: service_healthy}
