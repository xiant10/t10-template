# The foundation on one machine, over compose/base.yml: every core service published on
# 127.0.0.1; each component's compose/local.yml publishes its own. Ports come from config/local/settings.env.

services:
  auth-server:
    ports:
      - "127.0.0.1:${AUTH_PORT}:8081"
  t10-agent-control:
    ports:
      - "127.0.0.1:${AGENT_CONTROL_PORT}:8085"
  ai-gateway-llm:
    ports:
      - "127.0.0.1:${LLM_GATEWAY_PORT}:18080"
  ai-gateway-tools:
    ports:
      - "127.0.0.1:${TOOLS_GATEWAY_PORT}:18095"
  t10-collab:
    ports:
      - "127.0.0.1:${COLLAB_PORT}:8082"
  t10-knowledge:
    ports:
      - "127.0.0.1:${KNOWLEDGE_PORT}:18050"
  agent-ti:
    ports:
      - "127.0.0.1:${AGENT_TI_PORT}:18120"
  ai-gateway-agent:
    ports:
      - "127.0.0.1:${AGENT_GATEWAY_PORT}:18090"
  workbench:
    ports:
      - "127.0.0.1:${WORKBENCH_PORT}:8083"
