# crm's standard local wiring, written by scripts/render.py from its module.env
# (scripts/wiring.py). Don't edit: modules/crm/compose/local.yml can change anything here.
services:
  t10-crm:
    image: t10-crm:dev
    build:
      context: ../../modules/crm/src
      additional_contexts:
        kit: ../../platform/kit/go
    ports:
      - "127.0.0.1:${CRM_PORT}:18100"
